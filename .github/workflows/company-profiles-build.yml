name: Company Profiles — Build

# The routine that follows the deterministic "method" to fetch company data and
# open a PR for REVIEW — used when ADDING new companies (manual dispatch, or a
# repository_dispatch fired after a user requests one). Weekly refresh of
# companies already in the app goes straight to the DB via
# company-profiles-refresh.yml (no PR), so there is no schedule here.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated slugs to (re)build (optional)'
        required: false
        default: ''
      requests_only:
        description: 'Only process pending user requests'
        type: boolean
        required: false
        default: false
      limit:
        description: 'Max profiles to build this run (optional)'
        required: false
        default: ''
  repository_dispatch:
    types: [company-profile-request]

# Needs to push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: company-profiles-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build company profiles
        env:
          # Optional: lets the routine pull pending company_profile_requests.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          # repository_dispatch (from a user request) → only process requests.
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ARGS="--requests-only"
          else
            if [ "${{ github.event.inputs.requests_only }}" = "true" ]; then ARGS="$ARGS --requests-only"; fi
            if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
            if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          fi
          echo "Running: npx tsx scripts/company-profiles/build.ts $ARGS"
          npx tsx scripts/company-profiles/build.ts $ARGS

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: company-profiles/auto-update
          base: main
          commit-message: 'data: refresh deterministic company profiles'
          title: 'data: refresh company profiles'
          body: |
            Automated deterministic refresh of `data/companyProfiles/*.json`
            (Wikipedia / Wikidata / SEC EDGAR / Google News — no AI).

            Merging this PR triggers **Company Profiles — Sync to DB**, which
            upserts the committed profiles into `company_profiles`.

            Please review the diff before merging.
          labels: company-profiles, automated
          add-paths: data/companyProfiles/**
