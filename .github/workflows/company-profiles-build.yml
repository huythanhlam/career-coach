name: Company Profiles — Build

# The routine that follows the deterministic "method" to fetch company data and
# open a PR for REVIEW — used when ADDING new companies (manual dispatch, or a
# repository_dispatch fired after a user requests one). Weekly refresh of
# companies already in the app goes straight to the DB via
# company-profiles-refresh.yml (no PR), so there is no schedule here.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated slugs to (re)build (optional)'
        required: false
        default: ''
      requests_only:
        description: 'Only process pending user requests'
        type: boolean
        required: false
        default: false
      limit:
        description: 'Max profiles to build this run (optional)'
        required: false
        default: ''
  repository_dispatch:
    types: [company-profile-request]

# Needs to push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: company-profiles-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Build company profiles
        env:
          # Optional: lets the routine pull pending company_profile_requests.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Workflow inputs are bound to env vars and referenced as quoted shell
          # variables — NEVER interpolated with ${{ }} inside `run:`. Direct
          # interpolation splices attacker-controllable text into the shell before
          # bash ever sees it, and this job holds SUPABASE_SERVICE_ROLE_KEY (which
          # bypasses RLS). The argument list is a bash array so quoting survives.
          EVENT_NAME: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.only }}
          REQUESTS_ONLY: ${{ github.event.inputs.requests_only }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args=()
          # repository_dispatch (from a user request) → only process requests.
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            args=(--requests-only)
          else
            if [ "$REQUESTS_ONLY" = "true" ]; then args+=(--requests-only); fi
            if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
            if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          fi
          echo "Running: npx tsx scripts/company-profiles/build.ts ${args[*]}"
          npx tsx scripts/company-profiles/build.ts "${args[@]}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: company-profiles/auto-update
          base: main
          commit-message: 'data: refresh deterministic company profiles'
          title: 'data: refresh company profiles'
          body: |
            Automated deterministic refresh of `data/companyProfiles/*.json`
            (Wikipedia / Wikidata / SEC EDGAR / Google News — no AI).

            Merging this PR triggers **Company Profiles — Sync to DB**, which
            upserts the committed profiles into `company_profiles`.

            Please review the diff before merging.
          labels: company-profiles, automated
          add-paths: data/companyProfiles/**
