name: Blog Content — Build

# The scheduled routine that auto-curates blog posts. A 3-agent editorial
# pipeline (Ideator → Writer → Editor, scripts/blog/*) drafts posts, writes the
# approved ones to data/blog/posts/*.md, and opens a PR for human review.
# Merging that PR triggers Blog Content — Sync to DB, which publishes them.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts to generate this run'
        required: false
        default: '3'
      seed_only:
        description: 'Only use the evergreen seed topics (no web-search trends)'
        type: boolean
        required: false
        default: false
      trending_only:
        description: 'Only use web-search-discovered trending topics'
        type: boolean
        required: false
        default: false

# Needs to push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-content-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build blog content
        env:
          # The Editor/Writer/Ideator call Gemini directly with this key (same as
          # the prod Edge Function). Add it as a repo secret before first run.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: lets the routine dedupe against already-published posts.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          ARGS="--limit ${LIMIT:-3}"
          if [ "${{ github.event.inputs.seed_only }}" = "true" ]; then ARGS="$ARGS --seed-only"; fi
          if [ "${{ github.event.inputs.trending_only }}" = "true" ]; then ARGS="$ARGS --trending-only"; fi
          echo "Running: npx tsx scripts/blog/build.ts $ARGS"
          npx tsx scripts/blog/build.ts $ARGS

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: blog/auto-content
          base: main
          commit-message: 'content: auto-curated blog posts'
          title: 'content: new auto-curated blog posts'
          body: |
            Automated blog drafts from the 3-agent editorial pipeline
            (Ideator → Writer → Editor) in `scripts/blog/`. Each post passed the
            Editor agent; the metadata block records its editorial score and
            revision rounds.

            **Please review the drafts for accuracy, tone, and quality before
            merging.** Merging triggers **Blog Content — Sync to DB**, which
            upserts these posts into `blog_posts` and publishes them.
          labels: blog, automated
          add-paths: data/blog/posts/**
