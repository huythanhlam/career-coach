name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      # Reports known vulnerabilities without blocking merges. The current
      # high-severity findings are all in undici, a transitive dev-only dep of
      # @vercel/node (not shipped to users). Drop `continue-on-error` to make
      # this a hard gate once that's resolved.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
