name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repo.
# Denying everything else means a compromised dependency or build
# step cannot push code, publish packages, or mint OIDC tokens —
# the exfiltration vector used by recent npm supply-chain worms.
permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Lockfile-exact install. Honors .npmrc (ignore-scripts=true),
      # so dependency lifecycle scripts never execute in CI.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Incremental strict-mode gate: fails only if the strict-error count
      # rises above strict-baseline.json. Keeps `npm run lint` non-strict and
      # green while the strict debt is burned down. See scripts/strict-ratchet.mjs.
      - name: Strict typecheck ratchet
        run: npm run typecheck:strict

      - name: Test
        run: npm test

      - name: ESLint ratchet
        run: npm run lint:eslint

      - name: Prettier format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Block the build on known-vulnerable PRODUCTION dependencies.
      # Dev/build-only tooling (e.g. @vercel/node) is excluded so CI
      # is not blocked by advisories that never ship to users; review
      # those separately with `npm audit`.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Deploy the ai-gateway Edge Function to prod after checks pass. Runs ONLY on
  # pushes to main (never on PRs or forks), so the deploy token is never exposed
  # to untrusted PR code. This job deliberately does NOT run `npm ci` or any
  # build step: it executes only the trusted Supabase CLI against the function
  # source, so no third-party dependency code runs in the job that holds
  # SUPABASE_ACCESS_TOKEN — preserving the supply-chain posture of the checks job.
  #
  # `--no-verify-jwt` is REQUIRED: the function does its own auth (verifyUser)
  # after the CORS/OPTIONS branch, so the platform JWT gate must be off or the
  # unauthenticated preflight would be rejected (CORS failure in the browser).
  #
  # Runtime secrets (GEMINI_API_KEY, ALLOWED_ORIGIN, …) live on the Supabase
  # project and persist across deploys — this step ships code only.
  #
  # Requires two repo settings:
  #   - secret  SUPABASE_ACCESS_TOKEN  (Supabase account access token)
  #   - var     SUPABASE_PROJECT_REF   (e.g. odqotbyqxdyskoiuijah)
  deploy-ai-gateway:
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-ai-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # v2 runs on Node 24 (v1 targets the now-deprecated Node 20 runtime).
      # Pin an explicit version instead of `latest`: resolving "latest" makes an
      # unauthenticated GitHub API call that gets rate-limited on shared runners
      # ("Failed to resolve latest Supabase CLI release"). GITHUB_TOKEN also
      # authenticates the release asset fetch (60 → 5000 req/hr).
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The project ref is public (it's in the app's Supabase URL), so it is
      # hardcoded here — only SUPABASE_ACCESS_TOKEN needs to be a repo secret.
      - name: Deploy ai-gateway
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-gateway \
            --project-ref odqotbyqxdyskoiuijah \
            --no-verify-jwt
