name: Company Profiles — Weekly Refresh

# Automatic weekly refresh of every company already in the app: fetch its
# research from the structured sources and upsert it straight into the
# company_profiles table (no PR — these companies are already vetted).
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated slugs to refresh (optional)'
        required: false
        default: ''
      limit:
        description: 'Max companies to refresh this run (optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: company-profiles-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chrome for the render-only rating sources (e.g. RepVue). Without it the
      # pipeline simply skips them and still scrapes the fetch-only ones (Blind).
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Fetch + store company research
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROFILES_CONTACT_EMAIL: ${{ secrets.PROFILES_CONTACT_EMAIL }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          echo "Running: npx tsx scripts/company-profiles/refresh.ts $ARGS"
          npx tsx scripts/company-profiles/refresh.ts $ARGS
