name: Blog Content — Sync to DB

# The "publish" step. When a blog-content PR is merged to main, the committed
# markdown posts are upserted into the blog_posts table via the service role.
on:
  push:
    branches: [main]
    paths:
      - 'data/blog/posts/**'
  workflow_dispatch: {}

# Read-only on the repo; all writes go to Supabase, not git.
permissions:
  contents: read

concurrency:
  group: blog-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync posts into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/blog/sync.ts
